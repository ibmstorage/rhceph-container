name: Close stale PRs

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # ── Timing ────────────────────────────────────────────────────────
          # Skip the stale-warning phase; close directly after 21 days.
          # days-before-stale: -1 disables stale labelling entirely so the
          # full operations budget is spent on close operations only.
          days-before-stale: -1
          days-before-close: 21

          # Use created_at instead of updated_at so that bot comments, CI
          # status updates, or bulk label changes don't reset the clock and
          # keep old PRs alive indefinitely.
          ignore-updates: true

          # ── Close comment ─────────────────────────────────────────────────
          close-pr-message: |
            Closing this PR due to 21 days of inactivity. The associated
            container image on quay.io has expired.

            Re-open or open a new PR to trigger a fresh build.

          # ── Exemptions ────────────────────────────────────────────────────
          # PRs labelled "keep-open" or "do-not-close" are never touched.
          exempt-pr-labels: "keep-open,do-not-close"

          # Raised well above the expected PR count so reads + closes never
          # exhaust the budget in a single run.
          operations-per-run: 500
