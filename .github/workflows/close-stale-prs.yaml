name: Close stale PRs

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  pull-requests: write

jobs:
  close-old-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close PRs older than 21 days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cutoff=$(date -u -d '21 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          gh pr list --repo "$REPO" --state open --json number,createdAt,labels \
            --jq ".[] | select(.createdAt < \"$cutoff\")
                      | select((.labels | map(.name) | inside([\"keep-open\",\"do-not-close\"])) | not)
                      | .number" \
          | while read -r pr; do
              echo "Closing PR #$pr (older than 21 days)"
              gh pr close "$pr" --repo "$REPO" \
                --comment $'Closing this PR due to 21 days of inactivity. The associated container image on quay.io has expired.\n\nRe-open or open a new PR to trigger a fresh build.'
            done
