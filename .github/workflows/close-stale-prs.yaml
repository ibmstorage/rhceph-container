name: Close stale PRs

on:
  schedule:
    # Run every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # ── Timing ────────────────────────────────────────────────────────
          # Mark a PR stale after 14 days of no activity (matches image TTL).
          days-before-stale: 14
          # Close the PR 7 days after it was marked stale (21 days total).
          days-before-close: 0

          # ── Stale comment & label ─────────────────────────────────────────
          stale-pr-label: "stale"
          stale-pr-message: |
            This PR has had no activity for 14 days and the Konflux-built image
            has expired. It will be closed in 7 days unless there is new activity.

            To keep this PR open, push a new commit or remove the `stale` label.

          # ── Close comment ─────────────────────────────────────────────────
          close-pr-message: |
            Closing this PR due to 21 days of inactivity. The associated
            container image on quay.io has expired.

            Re-open or open a new PR to trigger a fresh build.

          # ── Exemptions ────────────────────────────────────────────────────
          # PRs labelled "keep-open" or "do-not-close" are never touched.
          exempt-pr-labels: "keep-open,do-not-close"

          # Only act on PRs, not issues.
          operations-per-run: 100
